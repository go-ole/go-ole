name: Test 64-bit Architectures

on: [pull_request, push, pull_request_target]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go: [ '1.25', 'stable' ]
        arch: [ 'amd64', 'arm64' ]
#        arch: [ 'amd64', 'arm64', 'loong64', 'mips64', 'mips64le', 'ppc64', 'ppc64le', 'riscv64', 's390x' ]
    env:
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: 'Download COM Test Release'
        uses: robinraju/release-downloader@v1
        with:
          repository: 'go-ole/test-com-server'
          tag: 'v2.0.0'
          fileName: 'TestCOMServer-x64.zip'
          out-file-path: 'test-com-server'
          extract: true
      - name: 'Setup .NET 9'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'
      - name: 'Register Assembly'
        run: 'regsvr32 /s ${{ github.workspace }}\test-com-server\TestCOMServer.comhost.dll'
      - name: 'Checkout Project'
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: 'Go Version'
        run: go version
      - name: 'Go Get'
        run: go get -v -t
      - name: 'Go Build'
        run: go build
      - name: Run tests
        run: go test